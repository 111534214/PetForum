  <title>爪印物語-文章詳情</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: url('image/555.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      background-color: white;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    .banner {
      background: url('image/dog.jpg') center/cover no-repeat;
      color: white;
      padding: 100px 40px 40px;
      text-align: center;

    }

    .banner h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .banner p {
      font-size: 25px;
      color: #eee;
    }

    .banner h1, .banner p {
      font-weight: 900;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: white;
      -webkit-text-stroke: 0.8px black;
      text-stroke: 0.8px black;
    }


    .toolbar {
      background: white;
      padding: 15px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ccc;
    }

    .toolbar-left span {
      font-weight: bold;
      margin-right: 30px;
    }

    .toolbar-right select,
    .toolbar-right button {
      padding: 8px 12px;
      font-size: 14px;
      margin-left: 10px;
    }

    .post-list {
      padding: 20px 40px;
    }

    .post-item {
      background: white;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .post-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .post-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

    .post-interact {
      font-size: 14px;
      display: flex;
      gap: 25px;
      color: #777;
    }

    .post-interact span {
      display: inline-flex;
      align-items: center;
    }

    .post-interact span::before {
      margin-right: 5px;
    }

    /*.post-interact .likes::before {*/
    /*  content: "👍";*/
    /*}*/

    /*.post-interact .comments::before {*/
    /*  content: "💬";*/
    /*}*/

    /*.post-interact .views::before {*/
    /*  content: "👁️";*/
    /*}*/

    .post-date {
      float: right;
      color: #888;
    }

    .post-item {
      background: white;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #aaa;
      border-radius: 6px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.1);
    }

    .post{
      border-radius: 10px;
      border: 1px solid black;
      margin: 30px;
      padding: 10px;
    }

    header {
      /* background-color: #a35830; */
      color: white;
      padding-bottom: 40px;
    }

    .navbar {
      background-color: rgba(91, 108, 156, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
    }

    .navbar .logo {
      font-size: 1.5em;
      font-weight: bold;
    }

    .navbar nav {
      display: flex;
      gap: 24px; /* 控制平均間距 */
      align-items: center;
    }

    .navbar nav a {
      text-decoration: none;
      color: white;
      font-weight: 500;
    }


    .navbar .login {
      font-weight: bold;
    }

    .no-posts {
      text-align: center;
      font-size: 2rem;
      color: #555;
      margin-top: 50px;
    }

    .primary-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      background-color: #566c47;
      color: white;
      text-decoration: none; /* ✅ 移除底線 */
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .profile-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo,
    .logo a,
    nav a,
    .hero h1,
    .hero h2 {
      user-select: none;
    }
    .logo a {
      color: white;             /* 原本的顏色 */
      text-decoration: none;    /* 移除底線 */
    }

    .logo a:visited,
    .logo a:hover,
    .logo a:active,
    .logo a:focus {
      color: white;             /* 維持白色 */
      text-decoration: none;    /* 確保所有狀態都沒底線 */
    }

    .logo,
    .logo a,
    nav a,
    .hero h1,
    .hero h2 {
      user-select: none;
    }


  </style>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedCategory = urlParams.get("category");

    const banner = document.querySelector(".banner");
    const categoryTitle = document.getElementById("categoryTitle");
    const categoryDescription = document.getElementById("categoryDescription");

    const categoryData = {
      "狗狗": { image: "image/b_dog.jpeg" },
      "貓貓": { image: "image/b_cat.jpg" },
      "魚魚": { image: "image/b_fish.jpg" },
      "鳥類": { image: "image/b_bird.jpg" },
      "鼠鼠": { image: "image/b_mou.jpg" },
      "兔子": { image: "image/b_rab.jpg" },
      "其他寵物": { image: "image/b_oth.png" }
    };

    document.addEventListener("DOMContentLoaded", function () {
      // Logo 跳轉根據登入判斷
      const loginUser = localStorage.getItem("loginUser");
      const logoLink = document.getElementById("logoLink");
      if (logoLink) {
        logoLink.href = loginUser ? "index_login.html" : "index.html";
      }

      // 使用者頭像設定
      const userId = localStorage.getItem("userId");
      const userName = localStorage.getItem("userName");
      if (userId && userName) {
        const avatarImg = document.getElementById("avatarImg");
        if (avatarImg) {
          avatarImg.src = `/api/users/${userId}/avatar`;
        }
      }

      // 分類 banner 與標題設定
      if (selectedCategory && categoryData[selectedCategory] && banner && categoryTitle && categoryDescription) {
        banner.style.background = `url('${categoryData[selectedCategory].image}') center/cover no-repeat`;
        categoryTitle.textContent = `${selectedCategory}版`;
        categoryDescription.textContent = categoryData[selectedCategory].description || '';
      } else if (categoryTitle && categoryDescription) {
        categoryTitle.textContent = `${selectedCategory || '未知'}版`;
        categoryDescription.textContent = `歡迎來到寵物論壇`;
      }

      // 排序監聽
      const sortSelect = document.getElementById("sortSelect");
      if (sortSelect) {
        sortSelect.addEventListener("change", function () {
          const selectedSort = this.value;
          loadCategoryPosts(selectedSort);
        });
      }

      // 頁面初始化
      loadCategoryPosts(); // 預設 "newest"
    });

    async function loadCategoryPosts(sort = "newest") {
      const urlParams = new URLSearchParams(window.location.search);
      const selectedCategory = urlParams.get("category");

      if (!selectedCategory) {
        alert("沒有指定分類！");
        return;
      }

      const categoryTitleDom = document.getElementById("categoryTitle");
      const categoryDescDom = document.getElementById("categoryDescription");
      const categoryTitle2Dom = document.getElementById("category-title");
      if (categoryTitleDom) categoryTitleDom.innerText = `${selectedCategory}版`;
      if (categoryDescDom) categoryDescDom.innerText = `分享有關${selectedCategory}的經驗與心得！`;
      if (categoryTitle2Dom) categoryTitle2Dom.innerText = `${selectedCategory} 文章`;

      try {
        const res = await fetch(`http://localhost:8080/api/posts/category/${selectedCategory}?sort=${sort}`);
        if (!res.ok) throw new Error("API 請求失敗");

        const posts = await res.json();
        console.log(posts); // debug 用
        const postList = document.getElementById("postList");
        if (!postList) return;
        postList.innerHTML = "";

        if (posts.length === 0) {
          postList.innerHTML = `<h2 class="no-posts">該分類目前沒有文章。</h2>`;
          return;
        }

        posts.forEach(post => {
          const postDiv = document.createElement("div");
          postDiv.className = "post";
          postDiv.innerHTML = `
          <h3 class="post-title">${post.title || "無標題"}</h3>
          ${post.user?.username ? `<p class="post-meta">${post.user.username} ️ | ${new Date(post.createdAt).toLocaleDateString()}</p>` : ""}
          <p class="post-excerpt">${post.content?.slice(0, 100)}...</p>
          <!--<div class="post-interact"> -->
          <!--  <span class="likes">${typeof post.likes === "number" ? post.likes : 0}</span> -->
          <!--  <span class="comments">${typeof post.commentCount === "number" ? post.commentCount : 0}</span> -->
          <!--  <span class="views">${typeof post.views === "number" ? post.views : 0}</span> -->
          <!--</div> -->
        `;
          postDiv.style.cursor = "pointer";
          postDiv.addEventListener("click", () => {
            window.location.href = `postdetailview.html?postId=${post.id}`;
          });

          postList.appendChild(postDiv);
        });

      } catch (error) {
        console.error("載入文章失敗", error);
        alert("載入文章失敗，請稍後再試。");
      }
    }
  </script>
