<!DOCTYPE html>
<html lang="zh-Hant">
    <meta charset="UTF-8" />
    <title>爪印物語 - 領養申請審核</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h1 { color: #000; }
        body.dark-mode h1 { color: #fff; }

        /* 表格格式調整 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background: #f4f6fa; font-weight: bold; }
        tbody tr:nth-child(even) { background: #f9f9f9; }
        tbody tr:hover { background: #e6f0fa; transition: background 0.15s; }

        .action-btn {
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .approve { background-color: #5c9c7c; color: white; }
        .reject { background-color: #b23b3b; color: white; }

        /* 主題按鈕調整 */
        #darkModeToggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        body.dark-mode #darkModeToggle {
            background: none;
            color: #fff;
        }

        /* 分類按鈕 */
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .tab-buttons .active { background-color: #5c9c7c; color: white; }
        body.dark-mode .tab-buttons .active { background-color: #76c8a3; color: #222; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        body.dark-mode .approve {
            background-color: #76c8a3;
            color: #222;
        }
        body.dark-mode .reject {
            background-color: #d9534f;
            color: #222;
        }
    </style>
<body>

<header>
    <div class="navbar">
        <div class="logo"><a href="index_login.html" style="color: white; text-decoration: none;">The Pet Forum</a></div>
        <nav>
            <a href="index_login.html">論壇</a>
            <a href="QAindex.html">毛孩大考驗</a>
            <a href="adopt.html">領養</a>
            <a onclick="history.back()">返回前頁</a>
        </nav>
    </div>
</header>

<main>
    <h1>領養申請審核</h1>

    <div class="tab-buttons">
        <button onclick="showTab('pending')" class="active" id="pendingBtn">待審核</button>
        <button onclick="showTab('approved')" id="approvedBtn">已接受申請</button>
        <button onclick="showTab('rejected')" id="rejectedBtn">已拒絕申請</button>
    </div>

    <div id="pendingApplications" class="tab-content active">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>申請者</th>
                <th>聯絡方式</th>
                <th>申請時間</th>
                <th>領養動機</th>
                <th>審核狀態</th>
                <th>審核者</th>
                <th>審核時間</th>
                <th>寵物ID</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="pendingTbody">
            <tr><td colspan="10" style="text-align:center;">載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="approvedApplications" class="tab-content">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>申請者</th>
                <th>聯絡方式</th>
                <th>申請時間</th>
                <th>領養動機</th>
                <th>審核狀態</th>
                <th>審核者</th>
                <th>審核時間</th>
                <th>寵物ID</th>
            </tr>
            </thead>
            <tbody id="approvedTbody">
            <tr><td colspan="8" style="text-align:center;">載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="rejectedApplications" class="tab-content">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>申請者</th>
                <th>聯絡方式</th>
                <th>申請時間</th>
                <th>領養動機</th>
                <th>審核狀態</th>
                <th>審核者</th>
                <th>審核時間</th>
                <th>寵物ID</th>
            </tr>
            </thead>
            <tbody id="rejectedTbody">
            <tr><td colspan="8" style="text-align:center;">載入中...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    function loadApplications(status) {
        fetch(`/api/adopt/review/${status}`)
            .then(res => res.json())
            .then(applications => {
                const tbody = document.getElementById(`${status}Tbody`);
                tbody.innerHTML = applications.length ? applications.map(app => `
            <tr>
                <td>${app.id}</td>
                <td>${app.name}</td>
                <td>${app.email} / ${app.phone}</td>
                <td>${new Date(app.createdAt).toLocaleString()}</td>
                <td>${app.reason}</td>
                <td>${app.status}</td>
                <td>${app.reviewedBy || "未審核"}</td>
                <td>${app.reviewedAt ? new Date(app.reviewedAt).toLocaleString() : "未審核"}</td>
                <td>${app.petId}</td>
                ${status === "pending" ? `
                    <td>
                        <button class="action-btn approve" onclick="approveApplication(${app.id})">通過</button>
                        <button class="action-btn reject" onclick="rejectApplication(${app.id})">拒絕</button>
                    </td>` : ""}
            </tr>
            `).join('') : `<tr><td colspan="10" style="text-align:center;">無申請資料</td></tr>`;
            });
    }



    function showTab(tab) {
        document.querySelectorAll(".tab-content").forEach(div => div.classList.remove("active"));
        document.querySelector(`#${tab}Applications`).classList.add("active");
        document.querySelectorAll(".tab-buttons button").forEach(btn => btn.classList.remove("active"));
        document.getElementById(`${tab}Btn`).classList.add("active");
    }

    document.addEventListener("DOMContentLoaded", () => {
        console.log("測試：網頁載入完成，開始執行 `loadApplications()`");
        loadApplications("pending");
        loadApplications("approved");
        loadApplications("rejected");
    });

    document.addEventListener("DOMContentLoaded", () => {
        const toggleBtn = document.getElementById("darkModeToggle");

        function updateIcon(isDark) {
            toggleBtn.textContent = isDark ? "☀️" : "🌙";
        }

        const stored = localStorage.getItem("darkMode");
        const isDarkMode = stored === "true";
        if (isDarkMode) document.body.classList.add("dark-mode");
        updateIcon(isDarkMode);

        toggleBtn.addEventListener("click", () => {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("darkMode", isDark ? "true" : "false");
            updateIcon(isDark);
        });

    });
    function approveApplication(id) {
        fetch(`/api/adopt/review/${id}/approve`, {
            method: "PUT",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ reviewer: "管理員" })
        })
            .then(res => res.json())
            .then(data => {
                alert(data.message || "申請已通過！");
                loadApplications("pending");  // 重新載入待審核列表
                loadApplications("approved"); // 更新已接受列表
            })
            .catch(err => console.error("審核通過錯誤：", err));
    }

    function rejectApplication(id) {
        fetch(`/api/adopt/review/${id}/reject`, {
            method: "PUT",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ reviewer: "管理員" })
        })
            .then(res => res.json())
            .then(data => {
                alert(data.message || "申請已拒絕！");
                loadApplications("pending");  // 重新載入待審核列表
                loadApplications("rejected"); // 更新已拒絕列表
            })
            .catch(err => console.error("審核拒絕錯誤：", err));
    }
</script>

</body>
</html>
