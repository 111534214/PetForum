<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>寵物論壇 - 新聞版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        .navbar {
            background-color: rgba(91, 108, 156, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            width: 100vw;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .navbar nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .navbar nav a {
            margin-left: 20px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero {
            text-align: center;
            padding: 60px 0 40px 0;
        }

        .title-container h1 {
            font-size: 64px;
            margin: 0;
            font-weight: bold;
            color: #0c2143;
        }

        .title-container .subtitle {
            font-size: 18px;
            font-weight: bold;
            color: #0c2143;
            margin-top: 5px;
        }

        .carousel {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            overflow: hidden;
            height: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .carousel-track {
            display: flex;
            width: calc(100% * 5);
            transition: transform 0.4s ease;
        }

        .carousel-track img {
            width: 20%;
            flex-shrink: 0;
            object-fit: cover;
            height: 400px;
            margin: 0;
            padding: 0;
            display: block;
            user-select: none;
            pointer-events: none;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            font-size: 2em;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            user-select: none;
        }

        .carousel-btn.left {
            left: 10px;
        }

        .carousel-btn.right {
            right: 10px;
        }

        .breaking-news {
            background-color: rgba(91, 108, 156, 0.8);
            color: white;
            font-weight: bold;
            padding: 10px 0;
            text-align: center;
            font-size: 1.1rem;
            margin-top: 20px;
        }

        .breaking-news marquee {
            width: 100%;
            display: block;
            white-space: nowrap;
        }

        .news-section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .news-section h2 {
            color: #275edc;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .news-list {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }

        .news-card {
            background: #f9f9f9;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
            width: calc(33.333% - 13.33px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 300px;
            overflow: hidden;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-4px);
        }

        .news-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .news-card h3 {
            font-size: 1.5rem;
            margin: 8px 0;
            flex-grow: 1;
            text-align: center;
            font-weight: bold;
        }

        .categories {
            width: 95%;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        .news-section:nth-child(odd) {
            background-color: #f0f0f0;
        }

        .news-section:nth-child(even) {
            background-color: #ffffff;
        }

        .news-section {
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .more-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: black;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
        }

        .more-link:hover {
            color: #275edc;
            text-decoration: underline;
        }
        @media (max-width: 1000px) {
            .container, .news-section {
                max-width: 98vw !important;
            }
            .carousel, .carousel-track img {
                height: 250px;
                max-width: 100vw;
            }
        }
        @media (max-width: 700px) {
            .news-list {
                flex-direction: column;
            }
            .news-card {
                width: 100%;
                height: auto;
            }
            .carousel, .carousel-track img {
                height: 150px;
            }
            .hero .title-container h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">The Pet Forum</a>
    <nav>
        <a href="index.html">論壇</a>
        <a href="QAindex.html">毛孩大考驗</a>
        <a href="adopt.html">領養</a>
        <a href="news.html">新聞</a>
        <a onclick="history.back()">返回前頁</a>
    </nav>
</header>

<section class="hero">
    <div class="title-container">
        <h1>爪印物語</h1>
        <p class="subtitle">The Pet Forum</p>
    </div>

    <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="carousel-btn left" aria-label="Previous Slide">&#8249;</button>
        <button class="carousel-btn right" aria-label="Next Slide">&#8250;</button>
    </div>
</section>

<div class="breaking-news">
    <marquee><strong> ⚠️ 夏日防曬提醒：</strong>別忘了給毛孩補充水分，注意防熱中暑喔‼️
    </marquee>
</div>

<br /><br /><br />

<div class="categories">
    <div class="category">
        <section class="news-section">
            <h2>🧠 用科技照顧毛孩的時代來了！</h2>
            <div class="news-list" id="news-list-tech"></div>
            <a href="news_detail.html?category=科技" class="more-link">查看更多...</a>
        </section>
        <section class="news-section">
            <h2>🍽️ 健康飼料和營養零食正夯！</h2>
            <div class="news-list" id="news-list-health"></div>
            <a href="news_detail.html?category=健康" class="more-link">查看更多...</a>
        </section>
        <section class="news-section">
            <h2>🌍 寵物相關的新政策你知道嗎？</h2>
            <div class="news-list" id="news-list-policy"></div>
            <a href="news_detail.html?category=政策" class="more-link">查看更多...</a>
        </section>
        <section class="news-section">
            <h2>一起來學習保護動物，從社區做起！</h2>
            <div class="news-list" id="news-list-protect"></div>
            <a href="news_detail.html?category=保護" class="more-link">查看更多...</a>
        </section>
        <section class="news-section">
            <h2>🛍️ 最近有哪些熱門的寵物用品？</h2>
            <div class="news-list" id="news-list-tool"></div>
            <a href="news_detail.html?category=用品" class="more-link">查看更多...</a>
        </section>
    </div>
</div>

<script>
    const images = [
        '/image/news1.jpg',
        '/image/news2.jpg',
        '/image/news3.jpg'
    ];

    const track = document.getElementById('carouselTrack');
    const extendedImages = [images[images.length - 1], ...images, images[0]];
    track.innerHTML = extendedImages.map(src => `<img src="${src}" alt="Carousel image">`).join('');

    let currentIndex = 1;
    const totalSlides = extendedImages.length;

    track.style.transform = `translateX(-${currentIndex * (100 / totalSlides)}%)`;

    let isTransitioning = false;

    function updateSlide() {
        track.style.transition = 'transform 0.5s ease';
        track.style.transform = `translateX(-${currentIndex * (100 / totalSlides)}%)`;
    }

    track.addEventListener('transitionend', () => {
        if (currentIndex === totalSlides - 1) {
            track.style.transition = 'none';
            currentIndex = 1;
            track.style.transform = `translateX(-${currentIndex * (100 / totalSlides)}%)`;
        }
        if (currentIndex === 0) {
            track.style.transition = 'none';
            currentIndex = totalSlides - 2;
            track.style.transform = `translateX(-${currentIndex * (100 / totalSlides)}%)`;
        }

        setTimeout(() => {
            track.style.transition = 'transform 0.5s ease';
            isTransitioning = false;
        }, 20);
    });

    function autoSlideFunction() {
        if (isTransitioning) return;
        isTransitioning = true;
        currentIndex++;
        updateSlide();
    }

    let autoSlide = setInterval(autoSlideFunction,1500);

    const leftBtn = document.querySelector('.carousel-btn.left');
    const rightBtn = document.querySelector('.carousel-btn.right');

    leftBtn.addEventListener('click', () => {
        if (isTransitioning) return;
        isTransitioning = true;
        currentIndex--;
        updateSlide();
        resetAutoSlide();
    });

    rightBtn.addEventListener('click', () => {
        if (isTransitioning) return;
        isTransitioning = true;
        currentIndex++;
        updateSlide();
        resetAutoSlide();
    });

    document.getElementById('carousel').addEventListener('mouseenter', () => {
        clearInterval(autoSlide);
    });

    document.getElementById('carousel').addEventListener('mouseleave', () => {
        autoSlide = setInterval(autoSlideFunction, 3000);
    });

    function resetAutoSlide() {
        clearInterval(autoSlide);
        autoSlide = setInterval(autoSlideFunction, 3000);
    }

    // 你的新聞部分 JS 保持不變
    function truncate(str, n) {
        return str.length > n ? str.substr(0, n) + '...' : str;
    }

    function openNewsDetail(newsId) {
        window.location.href = `news_detail_single.html?id=${newsId}`;
    }

    const categories = [
        { key: 'tech', listId: 'news-list-tech' },
        { key: 'health', listId: 'news-list-health' },
        { key: 'policy', listId: 'news-list-policy' },
        { key: 'protect', listId: 'news-list-protect' },
        { key: 'tool', listId: 'news-list-tool' }
    ];

    categories.forEach(cat => {
        fetch(`/api/news/category/${cat.key}`)
            .then(res => res.json())
            .then(data => {
                const listDom = document.getElementById(cat.listId);
                if (!listDom) return;
                listDom.innerHTML = data.map(news => `
            <div class="news-card" onclick="openNewsDetail(${news.id})">
              <img src="${news.image_url || 'default.jpg'}" alt="News" />
              <h3>${news.title}</h3>
              <p>${truncate(news.content, 36)}</p>
            </div>
          `).join('');
            });
    });
</script>

</body>
</html>
