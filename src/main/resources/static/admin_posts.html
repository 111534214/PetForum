<body>
<div style="height: 100px;"></div>
<div class="container">
    <h1>貼文管理</h1>
    <div class="toolbar">
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋" />
            <!-- <button onclick="loadPosts()">伺服器搜尋</button> -->
        </div>

    </div>
    <table>
        <thead>
        <tr>
            <th>標題</th>
            <th>作者</th>
            <th>發布時間</th>
            <th>狀態</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="postsTbody">
        <tr><td colspan="5" style="text-align:center;">載入中...</td></tr>
        </tbody>
    </table>
    <div id="pagination"></div>
</div>
<script>
    let lastPostsData = [];
    let currentPage = 1;
    const pageSize = 20;

    function loadPosts() {
        // 伺服器搜尋
        const keyword = document.getElementById('searchInput').value.trim();
        let url = "/api/posts";
        if (keyword) url += "?q=" + encodeURIComponent(keyword);
        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("API 錯誤");
                return res.json();
            })
            .then(posts => {
                if (!Array.isArray(posts)) posts = [];
                lastPostsData = posts;
                currentPage = 1;
                renderPosts(posts, currentPage);
            })
            .catch(err => {
                const tbody = document.getElementById('postsTbody');
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#c00;">載入失敗</td></tr>`;
                document.getElementById('pagination').innerHTML = "";
                console.warn(err);
            });
    }

    function renderPosts(posts, page = 1) {
        const tbody = document.getElementById('postsTbody');
        if (!posts || posts.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">查無資料</td></tr>`;
            document.getElementById('pagination').innerHTML = "";
            return;
        }
        // 分頁
        const start = (page - 1) * pageSize;
        const end = start + pageSize;
        const pagePosts = posts.slice(start, end);

        tbody.innerHTML = pagePosts.map(post => {
            let author = post.username || post.author || (post.user && post.user.username) || "未知";
            let status = post.status || "正常";
            return `
            <tr>
              <td>${post.title || ""}</td>
              <td>${author}</td>
              <td>${post.createdAt ? new Date(post.createdAt).toLocaleString() : ""}</td>
              <td>${status}</td>
              <td>
                <button class="action-btn view" onclick="viewPost(${post.id})">查看</button>
                <!-- <button class="action-btn edit" onclick="editPost(${post.id})">編輯</button> -->
                <button class="action-btn" onclick="deletePost(${post.id})">刪除</button>
              </td>
            </tr>
            `;
        }).join('');

        renderPagination(posts.length, page);
    }

    function renderPagination(total, page) {
        const pageCount = Math.ceil(total / pageSize);
        let html = '';

        if (pageCount <= 1) {
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        // 上一頁
        if (page > 1) {
            html += `<button onclick="gotoPage(${page - 1})">&lt;</button>`;
        } else {
            html += `<button disabled>&lt;</button>`;
        }

        // 頁碼
        for (let i = 1; i <= pageCount; i++) {
            if (i === page) {
                html += `<button class="current" disabled>${i}</button>`;
            } else if (i === 1 || i === pageCount || Math.abs(i - page) <= 2) {
                html += `<button onclick="gotoPage(${i})">${i}</button>`;
            } else if ((i === page - 3 && i > 1) || (i === page + 3 && i < pageCount)) {
                html += `<span style="margin:0 5px;">...</span>`;
            }
        }

        // 下一頁
        if (page < pageCount) {
            html += `<button onclick="gotoPage(${page + 1})">&gt;</button>`;
        } else {
            html += `<button disabled>&gt;</button>`;
        }

        document.getElementById('pagination').innerHTML = html;
    }

    function gotoPage(page) {
        currentPage = page;
        renderPosts(lastPostsData, page);
    }

    // 即時搜尋功能
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchInput");
        if (searchInput) {
            searchInput.addEventListener("input", function () {
                filterPosts(this.value.trim().toLowerCase());
            });
            // Enter 觸發伺服器搜尋
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') loadPosts();
            });
        }
        loadPosts();
    });

    function filterPosts(keyword) {
        // 前端即時過濾
        const tbody = document.getElementById('postsTbody');
        const trs = tbody.querySelectorAll('tr');
        trs.forEach(tr => {
            // 跳過「查無資料」或「載入中」
            if (tr.children.length < 5) return;
            const [titleTd, authorTd, timeTd, statusTd] = tr.children;
            const text = (
                (titleTd.textContent || "") +
                (authorTd.textContent || "") +
                (timeTd.textContent || "") +
                (statusTd.textContent || "")
            ).toLowerCase();

            if (keyword === "" || text.includes(keyword)) {
                tr.style.display = "";
            } else {
                tr.style.display = "none";
            }
        });
    }

    function viewPost(id) {
        window.open(`postdetailview.html?postId=${id}`, '_blank');
    }
    // function editPost(id) {
    //     window.location.href = `postedit.html?postId=${id}`;
    // }
    function deletePost(id) {
        if (!confirm("確定要刪除這篇貼文嗎？")) return;
        fetch(`/api/posts/${id}`, { method: "DELETE" })
            .then(res => {
                if (res.ok) {
                    alert("刪除成功！");
                    loadPosts();
                } else {
                    res.text().then(msg => alert("刪除失敗：" + msg));
                }
            });
    }
</script>
