<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>爪印物語- 登入</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: url('image/555.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(91, 108, 156, 0.8);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            margin-left: 1.5rem;
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-section {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .login-section h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 1rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .toggle-password {
            float: right;
            margin-top: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #555;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1.5rem;
            background-color: #414560;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .login-options {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .login-options a {
            color: #555;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        .login-options a:hover {
            text-decoration: underline;
        }
        .toggle-password {
            float: right;
            margin-top: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #555;
        }

        .logo a {
            color: white;             /* 原本的顏色 */
            text-decoration: none;    /* 移除底線 */
        }

        .logo a:visited,
        .logo a:hover,
        .logo a:active,
        .logo a:focus {
            color: white;             /* 維持白色 */
            text-decoration: none;    /* 確保所有狀態都沒底線 */
        }

    </style>
</head>
<body>

<header>
    <div class="logo"><a href="index.html">The Pet Forum</a></div>
    <nav>
        <a href="index.html">論壇</a>
        <a href="QAindex.html">毛孩大考驗</a>
        <a href="adopt.html">領養</a>
        <a href="news.html">新聞</a>
        <a onclick="history.back()">返回前頁</a>
    </nav>
</header>

<main>
    <section class="login-section">
        <form id="loginForm">
            <h2>使用者登入</h2>

            <label for="account">帳號（Email 或身分證）</label>
            <input type="text" id="account" name="account" placeholder="輸入 Email 或身分證">

            <label for="password">密碼</label>
            <input type="password" id="password" name="password" placeholder="輸入密碼">
            <div class="toggle-password" onclick="togglePassword('password')">
                <i id="icon-password" class="fas fa-eye"></i> 顯示密碼
            </div>


            <button type="submit">登入</button>

            <div class="login-options">
                <a href="register.html">註冊帳號</a> |
                <a href="forgot.html">忘記密碼？</a>
            </div>
        </form>
    </section>
</main>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const account = document.getElementById("account").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!account || !password) {
            alert("請輸入帳號與密碼！");
            return;
        }

        fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                account: account,
                password: password
            })
        })
            .then(res => res.json())
            .then(data => {
                if (data.message === "登入成功") {
                    localStorage.setItem("userName", data.username);
                    localStorage.setItem("userId", data.userId);
                    // ⭐ 新增這行：存下角色
                    localStorage.setItem("userRole", data.role);
                    console.log("✅ 登入成功，userId：", localStorage.getItem("userId"));
                    alert("登入成功！");
                    window.location.href = "/index_login.html";
                } else {
                    alert("登入失敗：" + data.message);
                }
            })
            .catch(err => {
                console.error("錯誤：", err);
                alert("系統錯誤，請稍後再試");
            });
    });
    function togglePassword(id) {
        const pwd = document.getElementById(id);
        const icon = document.getElementById('icon-password');
        if (pwd.type === "password") {
            pwd.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            pwd.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }


</script>


</body>
</html>
