<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>爪印物語-註冊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: url('image/555.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(91, 108, 156, 0.8);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo { font-size: 1.5rem; font-weight: bold; }

        nav a {
            margin-left: 1.5rem;
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-section {
            background-color: white;
            padding: 2.5rem;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .register-section h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 1rem;
            text-align: left;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.8rem;
            background-color: #414560;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .toggle-password {
            float: right;
            margin-top: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #555;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">The Pet Forum</div>
    <nav>
        <a href="index.html">論壇</a>
        <a href="QAindex.html">毛孩大考驗</a>
        <a href="adopt.html">領養</a>
        <a href="news.html">新聞</a>
        <a onclick="history.back()">返回前頁</a>
    </nav>
</header>

<main>
    <section class="register-section">
        <form id="registerForm">
            <h2>會員註冊</h2>

            <label for="username">暱稱（使用者名稱）</label>
            <input type="text" id="username" name="username" required>

            <label for="email">電子郵件</label>
            <input type="email" id="email" name="email" pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" required>

            <label for="password">密碼</label>
            <div style="position: relative;">
                <input type="password" id="password" name="password" required>
                <div class="toggle-password" onclick="togglePassword('password')">
                    <i id="icon-password" class="fas fa-eye"></i> 顯示密碼
                </div>
            </div>

            <label for="confirmPassword">再次輸入密碼</label>
            <div style="position: relative;">
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div class="toggle-password" onclick="togglePassword('confirmPassword')">
                    <i id="icon-confirmPassword" class="fas fa-eye"></i> 顯示密碼
                </div>
            </div>

            <label for="phoneNumber">電話號碼</label>
            <input type="text" id="phoneNumber" name="phoneNumber" placeholder="例如：0912-345-678" required>

            <label for="location">地區</label>
            <select id="location" name="location" required>
                <option value="">請選擇地區</option>
                <option>台北市</option><option>新北市</option><option>基隆市</option><option>桃園市</option>
                <option>新竹市</option><option>苗栗市</option><option>台中市</option><option>彰化市</option>
                <option>南投市</option><option>雲林市</option><option>嘉義市</option><option>台南市</option>
                <option>高雄市</option><option>屏東市</option><option>宜蘭市</option><option>花蓮市</option>
                <option>台東市</option>
            </select>

            <label for="idNumber">身分證字號</label>
            <input type="text" id="idNumber" name="idNumber" required>

            <label for="bio">自我介紹</label>
            <textarea id="bio" name="bio" rows="4" placeholder="介紹一下你自己或你與寵物的故事吧！"></textarea>

            <button type="submit">註冊</button>
        </form>
    </section>
</main>
</body>
</html>

<script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirm = document.getElementById("confirmPassword").value.trim();
        if (password !== confirm) {
            alert("❗ 兩次輸入的密碼不一致！");
            return;
        }
        const phone = document.getElementById("phoneNumber").value.trim();
        const location = document.getElementById("location").value;
        const idNumber = document.getElementById("idNumber").value.trim().toUpperCase();
        const bio = document.getElementById("bio").value.trim();

        // 電話驗證 (格式: 09XX-XXX-XXX)
        const phoneRegex = /^09\d{2}-\d{3}-\d{3}$/;
        if (!phoneRegex.test(phone)) {
            alert("❗ 電話格式錯誤，請使用格式 09XX-XXX-XXX");
            return;
        }

        // 身分證格式驗證 (大寫英文字母開頭 + 9位數字)
        const idRegex = /^[A-Z]{1}[0-9]{9}$/;
        if (!idRegex.test(idNumber)) {
            alert("❗ 身分證格式錯誤，請確認第一碼為大寫英文字 + 9碼數字");
            return;
        }

        const user = {
            username: username,
            email: email,
            password: password,
            confirmPassword: confirm,
            phoneNumber: phone,
            location: location,
            idNumber: idNumber,
            bio: bio
        };

        // 向後端送出 POST 請求
        fetch("/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        }).then(async response => {
            if (response.ok) {
                alert("✅ 註冊成功！將跳轉到登入頁");
                window.location.href = "/login.html";
            } else {
                const errorMsg = await response.text(); // 讀取錯誤訊息
                alert("❌ 註冊失敗：" + errorMsg);
            }
        })
    });

    function togglePassword(id) {
        const pwInput = document.getElementById(id);
        pwInput.type = pwInput.type === "password" ? "text" : "password";
    }
    document.getElementById("confirmPassword").addEventListener("input", function () {
        const pw = document.getElementById("password").value.trim();
        const confirm = this.value.trim();
        if (pw !== confirm) {
            this.setCustomValidity("密碼不一致");
        } else {
            this.setCustomValidity("");
        }
    });

    const userData = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        confirmPassword: document.getElementById("confirmPassword").value,
        phoneNumber: document.getElementById("phoneNumber").value,
        location: document.getElementById("location").value,
        idNumber: document.getElementById("idNumber").value,
        bio: document.getElementById("bio").value,
    };

    document.getElementById("email").addEventListener("blur", function () {
        const email = this.value.trim();
        if (!email) return;

        fetch(`/api/auth/check-email?email=${encodeURIComponent(email)}`)
            .then(res => res.json())
            .then(exists => {
                if (exists) {
                    alert("❗ 這個 Email 已經被註冊了");
                    this.setCustomValidity("Email 已存在");
                    this.reportValidity();
                } else {
                    this.setCustomValidity("");
                }
            }).catch(err => {
            console.error("Email 檢查失敗：", err);
        });
    });
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(`icon-${id}`);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }


</script>
